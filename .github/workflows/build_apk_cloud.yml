name: Build Debug APK (cloud)

on:
  push:
    branches: [feat/cache-storage-location]
  workflow_dispatch:

jobs:
  build:
    name: Debug APK arm64
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk PiliPlus-debug-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-debug-arm64
          path: PiliPlus-debug-arm64.apk

      - name: Create prerelease with APK (public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_id }}
          name: Debug build ${{ github.run_id }}
          prerelease: true
          files: PiliPlus-debug-arm64.apk
